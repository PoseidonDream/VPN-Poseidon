name: Windows

# On every push: test Free VPN on a real Windows machine and build FreeVPN.exe.
# On a version tag (like v1.4): also publish a release with the downloads. The
# app's updater looks at the latest release, so publishing one is how an update
# reaches everyone.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FREEVPN_OPENVPN: ${{ github.workspace }}\build\fake\openvpn\openvpn.exe
    steps:
      - uses: actions/checkout@v4

      - name: The version in FreeVPN.pyw must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Select-String -Path FreeVPN.pyw -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "$env:GITHUB_REF_NAME") { Write-Error "FreeVPN.pyw says $v but the tag is $env:GITHUB_REF_NAME"; exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tool
        run: python -m pip install pyinstaller==6.11.1

      - name: Build the stand-in for OpenVPN that the app tests talk to
        run: >
          python -m PyInstaller --noconfirm --onedir --console --name openvpn
          --distpath build\fake --workpath build\fake-work --specpath build
          tests\fake_openvpn.py

      - name: Windows checks (tray icon, start with Windows, Discord-only, update helper)
        run: python -I -u tests\windows_smoke.py FreeVPN.pyw

      - name: Discord-only engine
        run: python -I tests\test_split.py FreeVPN.pyw

      - name: Start-with-Windows task
        run: python -I tests\test_autostart.py FreeVPN.pyw

      - name: Tray icon files
        run: python -I tests\test_tray_units.py FreeVPN.pyw

      - name: Opening at sign-in
        run: python -I -u tests\test_startup_min.py "$env:RUNNER_TEMP\startmin" FreeVPN.pyw

      - name: Updates
        run: python -I -u tests\test_update.py "$env:RUNNER_TEMP\update" FreeVPN.pyw

      - name: The whole app (window, connecting, reconnecting, Discord-only, tray, closing)
        run: python -I -u tests\run_gui_test.py "$env:RUNNER_TEMP\guitest" FreeVPN.pyw win

      - name: Build FreeVPN.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name FreeVPN FreeVPN.pyw

      - name: Package the downloads
        run: |
          New-Item -ItemType Directory -Force out\FreeVPN | Out-Null
          Copy-Item FreeVPN.pyw, README.txt, "Start Free VPN.bat", "Build EXE (optional).bat" out\FreeVPN\
          Compress-Archive -Path out\FreeVPN -DestinationPath out\FreeVPN.zip -Force
          Copy-Item dist\FreeVPN.exe out\FreeVPN.exe
          Copy-Item FreeVPN.pyw out\FreeVPN.pyw

      - uses: actions/upload-artifact@v4
        with:
          name: FreeVPN
          path: |
            out/FreeVPN.zip
            out/FreeVPN.exe
            out/FreeVPN.pyw

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FreeVPN

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FreeVPN.exe FreeVPN.zip FreeVPN.pyw \
            --repo "$GITHUB_REPOSITORY" --title "Free VPN $GITHUB_REF_NAME" \
            --notes "**New here?** Download **FreeVPN.exe** (needs OpenVPN installed) or **FreeVPN.zip** (the Python version; see README.txt inside). **Already have Free VPN?** It offers this update by itself: click *Update now* in the blue bar. (FreeVPN.pyw is the file the Python version downloads when it updates.) Tested on Windows before this release was made."

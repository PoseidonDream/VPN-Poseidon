name: Windows

# On every push: test Free VPN on a real Windows machine and build FreeVPN.exe.
# On a version tag (like v1.4): also publish a release with the downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tool
        run: python -m pip install pyinstaller==6.11.1

      - name: Build the stand-in for OpenVPN that the app test talks to
        run: >
          python -m PyInstaller --noconfirm --onedir --console --name openvpn
          --distpath build\fake --workpath build\fake-work --specpath build
          tests\fake_openvpn.py

      - name: Windows checks (tray icon, start with Windows, Discord-only DNS rule and routes)
        run: python -I -u tests\windows_smoke.py FreeVPN.pyw

      - name: Engine checks
        run: |
          python -I tests\test_split.py FreeVPN.pyw
          python -I tests\test_autostart.py FreeVPN.pyw
          python -I tests\test_tray_units.py FreeVPN.pyw

      - name: App test (window, connecting, reconnecting, Discord-only, tray, closing)
        env:
          FREEVPN_OPENVPN: ${{ github.workspace }}\build\fake\openvpn\openvpn.exe
        run: |
          python -I -u tests\test_startup_min.py "$env:RUNNER_TEMP\startmin" FreeVPN.pyw
          python -I -u tests\run_gui_test.py "$env:RUNNER_TEMP\guitest" FreeVPN.pyw win

      - name: Build FreeVPN.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name FreeVPN FreeVPN.pyw

      - name: Package the downloads
        run: |
          New-Item -ItemType Directory -Force out\FreeVPN | Out-Null
          Copy-Item FreeVPN.pyw, README.txt, "Start Free VPN.bat", "Build EXE (optional).bat" out\FreeVPN\
          Compress-Archive -Path out\FreeVPN -DestinationPath out\FreeVPN.zip -Force
          Copy-Item dist\FreeVPN.exe out\FreeVPN.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FreeVPN
          path: |
            out/FreeVPN.zip
            out/FreeVPN.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FreeVPN

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FreeVPN.exe FreeVPN.zip \
            --repo "$GITHUB_REPOSITORY" --title "Free VPN $GITHUB_REF_NAME" \
            --notes "Download **FreeVPN.exe** (needs OpenVPN installed) or **FreeVPN.zip** (the Python version, see README.txt inside). Both were tested on Windows before this release was made."
